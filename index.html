<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter</title>
    <link rel="stylesheet" href="MEpage.css">
    <script type="text/javascript" src="logins.js" defer></script>
</head>
<body>
    <div class="container">
    <div id="preloader"></div>
    <main id="login-incial">
    <div class="bg-login">
    <header class="welcome"> <img src="images/winLOGO2.png" class="LOGOwin">
    <h1>To begin, put your username</h1>
    </header>
    <section class="login">
    <form id="form">
    <img src="images/blueBAR.png" class="BLUEbar" alt="" aria-hidden="true">
    <img src="images/PFPplaceholder.png" class="pfp" alt="User profile">
        <div class="loginCTRL"> <input required type="text" name="username" id="username-input" class="box">
        <button type="submit" class="enter"> <img src="images/enterICON.png"></button>
    </div>
    </form>
    </section>
    </div>
        <div class="barra-incial" aria-hidden="true"></div>
        <div class="barra-incial2" aria-hidden="true"></div>
    </main>
    </div>
<script>
    var loader = document.getElementById("preloader");
    window.addEventListener("load", function(){
        setTimeout(function(){
        loader.style.display = "none";
    }, 3000);
});
</script>
</body>
</html>
